<body class="bg-background font-body-md text-on-surface min-h-screen flex flex-col justify-between selection:bg-primary-fixed selection:text-on-primary-fixed relative overflow-x-hidden">
<!-- Fondo decorativo suave minimalista -->
<div class="absolute inset-0 bg-gradient-to-b from-primary/5 via-transparent to-surface pointer-events-none -z-10"></div>
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[350px] bg-primary-fixed/30 rounded-full blur-3xl pointer-events-none -z-10"></div>
<!-- Contenedor Central -->
<main class="flex-1 flex items-center justify-center w-full px-4 py-10">
<div class="w-full max-w-[420px]">
<!-- Tarjeta de Login -->
<div class="bg-surface-container-lowest rounded-2xl border border-outline-variant/40 shadow-[0_10px_30px_rgba(0,0,0,0.06)] p-8 sm:p-9 transition-all">
<!-- Logo Institucional -->
<div class="flex flex-col items-center text-center mb-6 justify-center w-full">
<img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDWWpj5a4rBTJpEatVkLB7NyaMpwZG1O1E9tLjnky0eHJDS8zqPr4VNlCpb7z0A24VHZSbITraRyMpyt0Z4UfCJ7giyBGA6Bl8KvfsEkApZkoUR7OEJRT5fLsbz0TZTNAxK3Z4KEPJi7MALsiuqyci02drmKrYzu9YECKSq6PHirVUJaDRTj3eT8cg4NPGmh-EQG-E2cDg9Bzl1eVEDcy99x3IX4LoNHjmUiZuY97Z62ZrcceT3VTRyjnj1uBWzK3et0A" alt="Hidroven Logo" class="h-16 w-auto object-contain mx-auto mb-3 block" style="transform: translate(1px, -2px);">
<span class="font-headline-sm text-lg font-bold text-primary tracking-tight">&nbsp; HIDROVEN&nbsp;&nbsp;</span>
<span class="text-xs font-medium text-tertiary tracking-wide uppercase mt-0.5">Intranet Institucional</span>
</div>
<!-- Encabezado -->
<div class="text-center mb-6">
<h1 class="font-headline-md text-xl font-bold text-on-surface tracking-tight">
            Iniciar Sesión
          </h1>
<p class="font-body-sm text-xs text-on-surface-variant mt-1">Ingrese su cédula y contraseña para acceder a la intranet</p>
</div>
<!-- Formulario -->
<form class="space-y-4" id="loginForm" onsubmit="event.preventDefault(); handleLoginSubmit();">
<!-- Campo 1: Usuario o Correo -->
<div class="space-y-1.5">
<label class="block font-label-md text-xs font-semibold text-on-surface" for="usuario">Cédula de Identidad</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-tertiary text-[18px] pointer-events-none">badge</span>
<input autocomplete="username" class="w-full pl-10 pr-4 py-2.5 rounded-lg bg-surface-container-low border border-transparent text-on-surface placeholder:text-outline/70 font-body-sm text-sm transition-all duration-150 outline-none focus:bg-surface-container-lowest focus:border-primary focus:ring-2 focus:ring-primary/20" id="usuario" name="usuario" placeholder="Ej. V-12.345.678" required="" type="text">
</div>
</div>
<!-- Campo 2: Contraseña -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-xs font-semibold text-on-surface" for="password">
                Contraseña
              </label>
<a class="font-body-sm text-xs text-primary hover:text-primary-container hover:underline font-medium transition-colors" href="#">
                ¿?
              </a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-tertiary text-[18px] pointer-events-none">
                lock
              </span>
<input autocomplete="current-password" class="w-full pl-10 pr-10 py-2.5 rounded-lg bg-surface-container-low border border-transparent text-on-surface placeholder:text-outline/70 font-body-sm text-sm transition-all duration-150 outline-none focus:bg-surface-container-lowest focus:border-primary focus:ring-2 focus:ring-primary/20" id="password" name="password" placeholder="••••••••••••" required="" type="password">
<button class="absolute right-3 p-1 rounded text-tertiary hover:text-on-surface transition-colors focus:outline-none" id="togglePassword" onclick="togglePasswordVisibility()" title="Mostrar u ocultar contraseña" type="button">
<span class="material-symbols-outlined text-[18px] block" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Checkbox: Recordar sesión -->

<!-- Botón de Ingreso -->
<button class="w-full mt-2 py-3 px-4 rounded-lg bg-primary hover:bg-[#005691] text-on-primary font-label-lg text-sm font-semibold flex items-center justify-center gap-2 shadow-sm hover:shadow-md transition-all duration-200 active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-primary/40 focus:ring-offset-2" id="btnSubmit" type="submit">
<span class="">Iniciar Sesión</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
</div>
</main>
<!-- Pie de página minimalista -->
<footer class="w-full py-5 px-4 text-center">
<div class="flex flex-col sm:flex-row items-center justify-center gap-1.5 sm:gap-3 text-xs text-tertiary">

<span class="hidden sm:inline text-outline-variant">•</span>
<a class="text-primary hover:underline font-medium inline-flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-[14px]">headset_mic</span>
        Soporte TI
      </a>
</div>
</footer>
<script>
// Función para alternar la visibilidad de la contraseña 
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.textContent = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        eyeIcon.textContent = 'visibility';
      }
    }
// Función para manejar el envío del formulario de inicio de sesión 
    function handleLoginSubmit() {
      const btn = document.getElementById('btnSubmit');
      const originalContent = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">sync</span><span>Iniciando sesión...</span>';
      
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = originalContent;
      }, 1500);
    }
  </script>








</body></html>
